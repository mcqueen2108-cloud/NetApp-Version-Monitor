name: Check NetApp Version

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Actualizado a v4.2.2 para compatibilidad interna con Node 24
      - uses: actions/checkout@v4.2.2

      # Actualizado a v6 para usar por defecto el entorno Node moderno
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python check_ontap.py
